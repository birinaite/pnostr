<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="nostr.bundle.js"></script>
</head>
<body>
    <div class="container">

        <div class="tabs">
            <div class="tab active" id="uploadTab">Upload</div>
            <div class="tab" id="viewTab">View</div>
        </div>

        <!-- Upload Tab Content -->
        <div class="tab-content active" id="uploadContent">
            <div class="drop-zone" id="dropZone">
                <p id="dropText">Drag a file here or click</p>
            </div>
            <input type="file" id="fileInput">
            <div class="file-info" id="fileInfo"></div>
            <div class="progress" id="uploadProgress">
                <div class="progress-bar" id="uploadProgressBar"></div>
            </div>
            <div class="status" id="uploadStatus"></div>
            <button id="uploadBtn" disabled>Upload</button>
            <div class="result" id="uploadResult">
                <p id="fileIdLabel">File ID:</p>
                <div class="file-id" id="fileId"></div>
                <div class="link-actions">
                    <a class="view-link" id="viewLink" href="#" target="_blank">View</a>
                    <button class="copy-link-btn" id="copyLinkBtn">Copy Link</button>
                </div>
            </div>
        </div>

        <!-- View Tab Content -->
        <div class="tab-content" id="viewContent">
            <div class="input-group">
                <input type="text" id="fileIdInput" placeholder="Enter ID">
                <button id="loadButton">Load</button>
            </div>
            <div class="progress" id="viewProgress">
                <div class="progress-bar" id="viewProgressBar"></div>
            </div>
            <div class="status" id="viewStatus"></div>
            <div class="file-info-view" id="viewFileInfo">
                <div class="file-name" id="fileName"></div>
                <div class="file-meta">
                    <span id="fileSize"></span>
                    <span id="fileType"></span>
                </div>
            </div>
            <div class="media-container" id="mediaContainer"></div>
            <div class="download-section" id="downloadSection">
                <a class="download-link" id="downloadLink" href="#" download>Download</a>
                <button class="copy-link-btn" id="copyViewLinkBtn">Share Link</button>
            </div>
        </div>
    </div>

    <!-- Modal para zoom da imagem -->
    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <img class="modal-image" id="modalImage" src="" alt="">
            <div class="modal-nav">
                <button class="modal-btn" id="modalDownload">Download</button>
                <button class="modal-btn" id="modalShare">Share</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <style>
        /* Estilos para o modal de imagem */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-modal.show {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        .image-modal.show .modal-content {
            transform: scale(1);
        }

        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-nav {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Estilos para os botões de copy */
        .copy-link-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .copy-link-btn:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        .copy-link-btn.copied {
            background: #28a745;
        }

        .link-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        /* Estilo para imagens clicáveis */
        .image-viewer {
            cursor: zoom-in;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 8px;
        }

        .image-viewer:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
    <script>
        // Auto-load quando tiver parâmetro 's' na URL
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const shareId = urlParams.get('s');
            
            if (shareId && typeof shareId === 'string' && shareId.trim()) {
                // Muda para a aba de visualização
                document.getElementById('viewTab').click();
                
                // Preenche o input com o ID (garantindo que seja string)
                const fileIdInput = document.getElementById('fileIdInput');
                fileIdInput.value = shareId.trim();
                
                // Aguarda um pouco para garantir que o script principal carregou
                setTimeout(() => {
                    // Verifica se o valor foi definido corretamente antes de carregar
                    if (fileIdInput.value && fileIdInput.value.trim()) {
                        document.getElementById('loadButton').click();
                    }
                }, 200);
                
                // Oculta a seção de input após carregar
                setTimeout(() => {
                    const inputGroup = document.querySelector('.input-group');
                    if (inputGroup) {
                        inputGroup.style.display = 'none';
                    }
                }, 1000);
            }

            // Funcionalidade de copy link
            function setupCopyButton(buttonId, getLinkFunction) {
                const button = document.getElementById(buttonId);
                if (button) {
                    button.addEventListener('click', async function() {
                        try {
                            const link = getLinkFunction();
                            await navigator.clipboard.writeText(link);
                            
                            const originalText = this.textContent;
                            this.textContent = 'Copied!';
                            this.classList.add('copied');
                            
                            setTimeout(() => {
                                this.textContent = originalText;
                                this.classList.remove('copied');
                            }, 2000);
                        } catch (err) {
                            console.error('Failed to copy:', err);
                            // Fallback para navegadores antigos
                            const textArea = document.createElement('textarea');
                            textArea.value = getLinkFunction();
                            document.body.appendChild(textArea);
                            textArea.focus();
                            textArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textArea);
                            
                            this.textContent = 'Copied!';
                            setTimeout(() => {
                                this.textContent = originalText;
                            }, 2000);
                        }
                    });
                }
            }

            // Setup copy buttons
            setupCopyButton('copyLinkBtn', () => document.getElementById('viewLink').href);
            setupCopyButton('copyViewLinkBtn', () => window.location.href);

            // Modal de imagem
            const imageModal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const closeModal = document.getElementById('closeModal');
            const modalDownload = document.getElementById('modalDownload');
            const modalShare = document.getElementById('modalShare');

            function openImageModal(src, downloadLink) {
                modalImage.src = src;
                imageModal.style.display = 'flex';
                setTimeout(() => imageModal.classList.add('show'), 10);
                
                modalDownload.onclick = () => {
                    const a = document.createElement('a');
                    a.href = downloadLink;
                    a.download = 'image';
                    a.click();
                };

                modalShare.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(window.location.href);
                        modalShare.textContent = 'Copied!';
                        setTimeout(() => modalShare.textContent = 'Share', 2000);
                    } catch (err) {
                        console.error('Failed to copy:', err);
                    }
                };
            }

            function closeImageModal() {
                imageModal.classList.remove('show');
                setTimeout(() => imageModal.style.display = 'none', 300);
            }

            closeModal.addEventListener('click', closeImageModal);
            imageModal.addEventListener('click', function(e) {
                if (e.target === imageModal) closeImageModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeImageModal();
            });

            // Interceptar criação de imagens no media container
            const originalCreateMediaPlayer = window.createMediaPlayer;
            window.createMediaPlayer = function(blob, metadata) {
                if (originalCreateMediaPlayer) {
                    originalCreateMediaPlayer(blob, metadata);
                }
                
                // Se for imagem, adicionar funcionalidade de modal
                if (metadata.t.startsWith('image/')) {
                    setTimeout(() => {
                        const img = document.querySelector('.image-viewer');
                        if (img) {
                            img.addEventListener('click', function() {
                                openImageModal(this.src, this.src);
                            });
                        }
                    }, 100);
                }
            };
        });
    </script>
</body>
</html>
